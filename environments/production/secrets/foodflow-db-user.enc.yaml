# SOPS template for foodflow-db-user secret
# Encrypt with: sops --encrypt --age <recipient> foodflow-db-user.yaml > foodflow-db-user.enc.yaml

apiVersion: v1
kind: Secret
metadata:
  name: foodflow-db-user
  namespace: foodflow
type: Opaque
stringData:
  username: ENC[AES256_GCM,data:XXX,type:str]
  password: ENC[AES256_GCM,data:XXX,type:str]
  host: ENC[AES256_GCM,data:XXX,type:str]
  uri: ENC[AES256_GCM,data:XXX,type:str]
sops:
  age:
    - enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        # Your age recipient here
        -----END AGE ENCRYPTED FILE-----
      recipient: age1yourrecipient
  encrypted_regex: ^(data|stringData)$
  lastmodified: "2024-01-01T00:00:00Z"
  mac: ENC[AES256_GCM,data:XXX,type:str]
  version: 3.13.1
