# SOPS template for GHCR pull secret
# Encrypt with: sops --encrypt --age <recipient> ghcr-secret.yaml > ghcr-secret.enc.yaml

apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: foodflow
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: ENC[AES256_GCM,data:XXX,type:str]
sops:
  age:
    - enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        # Your age recipient here
        -----END AGE ENCRYPTED FILE-----
      recipient: age1yourrecipient
  encrypted_regex: ^(data|stringData)$
  lastmodified: "2024-01-01T00:00:00Z"
  mac: ENC[AES256_GCM,data:XXX,type:str]
  version: 3.13.1
