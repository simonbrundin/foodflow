apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodflow-app
spec:
  template:
    spec:
      containers:
        - name: foodflow-app
          # Updated by CI/CD pipeline
          image: ghcr.io/simonbrundin/foodflow@sha256:7db9e50a46744754294ed497d03a71195136a3c7c34a3d4f260c842f82b0f6ee
          env:
            - name: NODE_ENV
              value: "production"
            - name: NUXT_PUBLIC_APP_URL
              value: "https://foodflow.simonbrundin.com"
            - name: NUXT_PUBLIC_API_URL
              value: "https://foodflow.simonbrundin.com/api"
