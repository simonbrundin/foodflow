apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: foodflow-db
  namespace: foodflow
spec:
  instances: 1

  bootstrap:
    initdb:
      database: foodflow
      owner: admin

  storage:
    storageClass: cnpg
    size: 1Gi
    resizeInUseVolumes: true
  monitoring:
    enablePodMonitor: true

  managed:
    roles:
      - name: admin
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: foodflow-db-admin
      - name: user
        ensure: present
        login: true
        passwordSecret:
          name: foodflow-db-user
