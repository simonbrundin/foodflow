apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodflow-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          env:
            - $patch: replace
            - name: NODE_ENV
              value: "development"
            - name: PORT
              value: "8080"
            - name: NUXT_PRESET
              value: "node-server"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: foodflow-db-user
                  key: host
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "foodflow"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: foodflow-db-user
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodflow-db-user
                  key: password
            - name: NUXT_OAUTH_ZITADEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: foodflow-app-secrets
                  key: NUXT_OAUTH_ZITADEL_CLIENT_ID
            - name: NUXT_OAUTH_ZITADEL_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: foodflow-app-secrets
                  key: NUXT_OAUTH_ZITADEL_DOMAIN
            - name: NUXT_OAUTH_ZITADEL_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: foodflow-app-secrets
                  key: NUXT_OAUTH_ZITADEL_REDIRECT_URL
            - name: APP_URL
              value: "http://localhost:3500"
