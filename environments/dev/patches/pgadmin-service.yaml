apiVersion: v1
kind: Service
metadata:
  name: foodflow-pgadmin
  labels:
    app: foodflow-pgadmin
spec:
  type: NodePort
  selector:
    app: foodflow-pgadmin
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodflow-pgadmin
  labels:
    app: foodflow-pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foodflow-pgadmin
  template:
    metadata:
      labels:
        app: foodflow-pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@pg.app"
            - name: PGADMIN_DEFAULT_PASSWORD
              value: "admin@pg.app"
          volumeMounts:
            - name: pgadmin-servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: pgadmin-servers
          configMap:
            name: foodflow-pgadmin-servers
