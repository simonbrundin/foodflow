apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodflow-app
spec:
  template:
    spec:
      containers:
        - name: foodflow-app
          image: ghcr.io/simonbrundin/foodflow:frontend-dev
          env:
            - name: NODE_ENV
              value: "development"
            - name: NUXT_PUBLIC_APP_URL
              value: "http://localhost:3000"
            - name: NUXT_PUBLIC_API_URL
              value: "http://localhost:3000/api"
