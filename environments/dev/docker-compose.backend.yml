version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodflow-db
    environment:
      POSTGRES_DB: foodflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: environments/dev/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=foodflow
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PORT=8080
      - NUXT_PRESET=node-server
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
